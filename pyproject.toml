[project]
name = "sayra"
version = "0.1.0"
description = "A LLM-based foreign language chat practice system"
authors = [{ name = "tropical-algae", email = "tropicalalgae@gmail.com" }]
requires-python = ">=3.13"
readme = "README.md"
license = "MIT"
dependencies = [
  "fastapi>=0.139.2,<0.140",
  "uvicorn>=0.51.0,<0.52",
  "pydantic>=2.13.4,<3",
  "loguru>=0.7.3,<0.8",
  "pydantic-settings>=2.14.2,<3",
  "sqlalchemy>=2.0.51,<3",
  "python-multipart>=0.0.32,<0.1",
  "aiosqlite>=0.22.1,<0.23",
  "httpx>=0.28.1",
  "openai>=2.21.0,<3",
  "json-repair>=0.55.0",
  "minio>=7.2.15,<8",
  "websockets>=15.0,<16",
]

[project.urls]
Repository = "https://github.com/tropical-algae/sayra.git"

[dependency-groups]
dev = [
  "pytest>=9.1.1,<10",
  "pytest-cov>=7.1.0,<8",
  "mypy>=2.3.0,<3",
  "ruff>=0.15.22,<0.16",
  "pre-commit>=4.6.1,<5",
  "poethepoet>=0.48.0,<0.49",
]

release = ["python-semantic-release>=10.6.1,<11"]


[tool.uv]
default-groups = ["dev"]

[[tool.uv.index]]
name = "proxy-source"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"

[tool.hatch.build.targets.sdist]
include = ["src/sayra"]

[tool.hatch.build.targets.wheel]
include = ["src/sayra"]

[tool.hatch.build.targets.wheel.sources]
"src/sayra" = "sayra"

[tool.poe]
include = "poe_tasks.toml"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
